[project]
name = "kernel-agent"
version = "0.1.0"
description = "Minimal Triton kernel optimizer (LLM-guided)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Optional: OpenAI backend when --backend openai
    "openai>=1.100.0",
    # todo: rm and only keep their apply_patch?
    "gpt-oss",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kernel_agent"]
package-dir = {"kernel_agent" = "."}

[project.scripts]
kernel-agent = "kernel_agent.main:main"

